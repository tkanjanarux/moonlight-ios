name: Moonlight Duo IPA
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify toolchain
        run: |
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
          xcodebuild -version | grep -Fx 'Xcode 27.2'
          xcrun --sdk iphoneos --show-sdk-version
          git submodule status --recursive
      - name: Build unsigned Release ARM64
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CURRENT_PROJECT_VERSION=2 CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build 2>&1 | tee build.log
      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Moonlight.app" "$RUNNER_TEMP/ipa/Payload/Moonlight.app"
          app="$RUNNER_TEMP/ipa/Payload/Moonlight.app"
          find "$app" -name _CodeSignature -type d -prune -print -exec rm -rf {} +
          find "$app" -name embedded.mobileprovision -type f -print -delete
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/Moonlight-Duo.ipa" Payload)
          python3 scripts/verify_ipa.py dist/Moonlight-Duo.ipa | tee dist/verification.txt
          shasum -a 256 dist/Moonlight-Duo.ipa | tee dist/SHA256SUMS.txt
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Duo
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
